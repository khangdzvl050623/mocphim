spring.application.name=backend_web

# ===== SERVER =====
server.port=8080
server.forward-headers-strategy=native

# ===== DATABASE PostgreSQL =====
spring.datasource.url=${DB_URL:jdbc:postgresql://dpg-d98ghrjtqb8s73fkcq60-a:5432/mocphim_vuev}
spring.datasource.username=${DB_USERNAME:mocphim_vuev_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===== CACHE — Redis =====
spring.cache.type=redis

# ===== SESSION — Redis =====
# Chỉ luồng OAuth2 dùng session (giữ `state` chống CSRF giữa hai chặng redirect);
# phần còn lại của API là stateless bằng JWT. Để session trong RAM thì mỗi lần
# instance restart / ngủ dậy là mất, người dùng đang đăng nhập dở nhận
# "authorization_request_not_found".
spring.session.store-type=redis
# `default` chứ không phải `indexed`: bản indexed cần bật keyspace notifications
# (CONFIG SET notify-keyspace-events), lệnh mà Redis managed thường chặn.
spring.session.redis.repository-type=default
spring.session.redis.namespace=mocphim:session
# Session chỉ sống đủ để đi hết một vòng OAuth2, không phải để giữ đăng nhập.
server.servlet.session.timeout=10m

redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
redis.user=${REDIS_USER:default}
redis.password=${REDIS_PASSWORD:}
redis.timeout-ms=2000

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-expiration=1800000
app.jwt.refresh-expiration=604800000

# ===== OAUTH2 =====
app.oauth2.authorized-redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback/google}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/oauth2/callback/{registrationId}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code

# ===== OPHIM UPSTREAM =====
ophim.base-url=https://ophim1.com/v1/api
ophim.timeout-ms=10000

# ===== SCHEDULER =====
scheduler.movie-sync.enabled=true
scheduler.movie-sync.cron=0 * * * * *

# ===== ADMIN DEFAULT ACCOUNT =====
app.admin.email=${ADMIN_EMAIL:admin@mocphim.com}
app.admin.password=${ADMIN_PASSWORD:}

# ===== CORS =====
cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://mocphim.vercel.app,https://moc-phim.vercel.app,http://103.229.53.17,https://moc-phim-api.duckdns.org

# ===== LOGGING =====
logging.level.mocphim.com.backend_web=DEBUG

# ===== EMAIL — Brevo SMTP =====
# Host/port/from trước đây hard-code: host trỏ nhầm sang Gmail trong khi
# credential là của Brevo, còn from lại đặt bằng SMTP login (ab03af001@smtp-brevo.com)
# thay vì sender đã verify. Đưa hết ra biến môi trường để đổi được theo môi trường
# deploy mà không phải sửa code.
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
# Username là SMTP login của Brevo (dạng xxxxxx@smtp-brevo.com), KHÔNG phải email người gửi.
spring.mail.username=${MAIL_USERNAME:}
# Password là SMTP key của Brevo, KHÔNG phải mật khẩu đăng nhập tài khoản.
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8
# Không có timeout thì khi nhà cung cấp chặn port SMTP, thread gửi mail treo đến
# khi OS tự huỷ kết nối — vừa giữ thread vừa không cho biết nguyên nhân.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.url=${APP_URL:http://localhost:8080}
# Phải là địa chỉ đã Verified trong Brevo (Senders, domains, IPs), nếu không Brevo từ chối.
app.mail.from=${MAIL_FROM:}

# ===== ACTUATOR — health check public cho cron ping (giữ Render không sleep) =====
# Chỉ expose /actuator/health, không expose env/beans/metrics...
management.endpoints.web.exposure.include=health
# Chỉ trả về {"status":"UP"}, không lộ chi tiết DB/Redis/disk ra ngoài
management.endpoint.health.show-details=never
# Group "ping": luôn UP, không phụ thuộc DB/Redis — dùng cho cron-job.org
management.endpoint.health.group.ping.include=ping

# Tắt mail health check của Actuator (Brevo từ chối IP local khi ping)
management.health.mail.enabled=false
